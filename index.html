<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6155df"><meta name="description" content="Organize suas empresas, conversas e retornos."><title>Impulso • Meus clientes</title><link rel="stylesheet" href="styles.css"><script defer src="data.js"></script><script defer src="app.js"></script></head>
<body><div class="app"><header><div class="brand"><span class="logo">↗</span><div>impulso<small>Seu próximo cliente, mais perto.</small></div></div><button class="square" id="addButton" aria-label="Adicionar empresa">＋</button></header><main id="main"></main></div><nav id="nav" aria-label="Navegação"><button data-page="home">⌂<small>Início</small></button><button data-page="leads">▦<small>Empresas</small></button><button data-page="agenda">◷<small>Retornos</small></button><button data-page="settings">⚙<small>Ajustes</small></button></nav><dialog id="detail"><div class="dialoghead"><b>Ficha da empresa</b><button class="square" data-close="detail" aria-label="Fechar">×</button></div><div id="detailbody" class="dialogbody"></div></dialog><dialog id="add"><div class="dialoghead"><b>Nova empresa</b><button class="square" data-close="add" aria-label="Fechar">×</button></div><form id="addForm" class="dialogbody"><label>Nome da empresa<input name="name" required maxlength="180"></label><label>Telefone com DDD<input name="phone" type="tel"></label><label>Endereço<input name="address" maxlength="300"></label><label>Prioridade<select name="priority"><option>A</option><option>B</option><option>C</option></select></label><button class="primary full">Adicionar empresa</button></form></dialog><input type="file" accept=".json,application/json" id="import" hidden><div id="toast" role="status" aria-live="polite"></div></body></html>
